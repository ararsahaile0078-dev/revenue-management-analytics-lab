<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forecasting Laboratory | RM Analytics Lab</title>

<meta name="description"
content="Interactive airline Revenue Management demand forecasting laboratory covering booking curves, forecasting models, accuracy and commercial decision-making.">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #08111d;
    --panel: #0d1825;
    --panel2: #101d2b;
    --border: #26384b;
    --text: #edf2f7;
    --muted: #9eb0c4;
    --blue: #8fb9df;
    --orange: #f6a54f;
    --green: #75c69b;
    --red: #e77c7c;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    line-height: 1.6;
}

a {
    color: inherit;
    text-decoration: none;
}

/* NAVIGATION */

nav {
    height: 78px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4.5%;
    position: sticky;
    top: 0;
    background: rgba(8,17,29,0.96);
    backdrop-filter: blur(10px);
    z-index: 20;
}

.logo {
    font-size: 24px;
    font-weight: 700;
}

.logo span {
    color: var(--orange);
}

.nav-links {
    display: flex;
    gap: 34px;
    color: var(--muted);
}

.nav-links a:hover {
    color: var(--text);
}

/* GENERAL */

.container {
    width: 90%;
    max-width: 1450px;
    margin: auto;
}

section {
    padding: 105px 0;
}

.eyebrow {
    color: var(--blue);
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 25px;
}

h1 {
    font-family: Georgia, serif;
    font-size: clamp(48px, 7vw, 94px);
    line-height: 0.98;
    font-weight: 400;
    max-width: 1100px;
}

h1 span {
    color: var(--orange);
}

h2 {
    font-family: Georgia, serif;
    font-size: clamp(38px, 5vw, 64px);
    font-weight: 400;
    line-height: 1.05;
    margin-bottom: 25px;
}

h3 {
    font-size: 20px;
    margin-bottom: 12px;
}

.lead {
    color: var(--muted);
    font-size: 20px;
    max-width: 900px;
    margin-top: 35px;
}

.small {
    color: var(--muted);
    font-size: 14px;
}

/* HERO */

.hero {
    min-height: 78vh;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--border);
}

.hero-grid {
    display: grid;
    grid-template-columns: 1.3fr 0.7fr;
    gap: 70px;
    align-items: center;
}

.hero-card {
    border: 1px solid var(--border);
    background: var(--panel);
    padding: 35px;
}

.hero-card .number {
    font-size: 58px;
    font-family: Georgia, serif;
    color: var(--orange);
}

.hero-card p {
    color: var(--muted);
}

/* SECTION INTRO */

.section-intro {
    max-width: 850px;
    margin-bottom: 55px;
}

/* MODEL CARDS */

.models {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.model-card {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 28px;
    min-height: 240px;
    transition: 0.25s;
}

.model-card:hover {
    border-color: var(--orange);
    transform: translateY(-4px);
}

.model-number {
    color: var(--orange);
    letter-spacing: 2px;
    font-size: 13px;
    margin-bottom: 45px;
}

.model-card p {
    color: var(--muted);
    font-size: 14px;
}

/* LAB */

.lab {
    background: #09131f;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
}

.lab-grid {
    display: grid;
    grid-template-columns: 330px 1fr;
    gap: 25px;
}

.controls {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 28px;
}

.control {
    margin-bottom: 27px;
}

.control label {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 9px;
}

.control strong {
    color: var(--text);
}

select,
input[type="range"] {
    width: 100%;
}

select {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 12px;
    border-radius: 2px;
}

input[type="range"] {
    accent-color: var(--orange);
}

button {
    width: 100%;
    background: var(--orange);
    border: none;
    padding: 14px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    opacity: 0.85;
}

/* DASHBOARD */

.dashboard {
    display: grid;
    gap: 18px;
}

.metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.metric {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 22px;
}

.metric .label {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.metric .value {
    font-size: 30px;
    margin-top: 8px;
}

.chart-card {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 25px;
}

.chart-title {
    display: flex;
    justify-content: space-between;
    margin-bottom: 18px;
}

.chart-title span {
    color: var(--muted);
    font-size: 13px;
}

canvas {
    width: 100%;
    height: 390px;
    display: block;
}

/* INSIGHT */

.insight {
    border-left: 3px solid var(--orange);
    background: var(--panel);
    padding: 28px;
}

.insight strong {
    color: var(--orange);
}

/* TABLE */

.table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th,
td {
    text-align: left;
    padding: 17px;
    border-bottom: 1px solid var(--border);
}

th {
    color: var(--orange);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

td {
    color: var(--muted);
}

/* BOOKING CURVE */

.booking-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
}

.booking-card {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 28px;
}

.booking-card ul {
    list-style: none;
}

.booking-card li {
    border-bottom: 1px solid var(--border);
    padding: 13px 0;
    color: var(--muted);
}

.booking-card li span {
    color: var(--text);
    float: right;
}

/* FOOTER */

footer {
    border-top: 1px solid var(--border);
    padding: 50px 5%;
    color: var(--muted);
    text-align: center;
    font-size: 13px;
}

/* RESPONSIVE */

@media(max-width: 1000px) {
    .hero-grid,
    .lab-grid,
    .booking-layout {
        grid-template-columns: 1fr;
    }

    .models {
        grid-template-columns: repeat(2, 1fr);
    }

    .metrics {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 650px) {
    nav {
        padding: 0 20px;
    }

    .nav-links {
        display: none;
    }

    section {
        padding: 70px 0;
    }

    .models,
    .metrics {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 50px;
    }
}
</style>
</head>

    </a>
